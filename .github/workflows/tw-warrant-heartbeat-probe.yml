name: TW Warrant Heartbeat Data Builder

on:
  push:
    branches: [develop]
    paths:
      - "user_data/tw_warrant_heartbeat/probe.py"
      - "user_data/tw_warrant_heartbeat/build_heartbeat.py"
      - "user_data/tw_warrant_heartbeat/build_heartbeat_v3.py"
      - "user_data/tw_warrant_heartbeat/build_heartbeat_v4.py"
      - "user_data/tw_warrant_heartbeat/build_heartbeat_v5.py"
      - "user_data/tw_warrant_heartbeat/build_heartbeat_v6.py"
      - ".github/workflows/tw-warrant-heartbeat-probe.yml"
  schedule:
    # Staggered pre-08:00 Asia/Taipei builds. Later successful runs refresh the same compact snapshot.
    # 06:50 / 07:20 / 07:45 Asia/Taipei = 22:50 / 23:20 / 23:45 UTC (previous calendar day)
    - cron: "50 22 * * *"
    - cron: "20 23 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tw-warrant-heartbeat-data-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore short-lived official source cache
        uses: actions/cache@v4
        with:
          path: user_data/tw_warrant_heartbeat/.source_cache
          key: tw-warrant-source-cache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tw-warrant-source-cache-v1-${{ runner.os }}-

      - name: Build compact heartbeat data from resilient official sources
        shell: bash
        run: |
          set +e
          certified=0
          for attempt in 1 2 3; do
            echo "Heartbeat build attempt ${attempt}/3"
            python user_data/tw_warrant_heartbeat/build_heartbeat_v6.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              python -c "import json; d=json.load(open('user_data/tw_warrant_heartbeat/latest.json', encoding='utf-8')); raise SystemExit(0 if d.get('pipeline',{}).get('all_market_pure_warrant_top100_certifiable') else 1)"
              if [ "$?" -eq 0 ]; then
                certified=1
                break
              fi
            fi
            sleep $((attempt * 20))
          done
          echo "all_market_certified=${certified}"
          # Keep partial official output if all retries are still degraded; validation below checks schema integrity.
          exit 0

      - name: Validate compact result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('user_data/tw_warrant_heartbeat/latest.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          required = [
              'pipeline',
              'data_status',
              'pure_warrant_top100_summary',
              'pure_warrant_top100',
              'filter_funnel',
              'bullish_calls',
              'bearish_puts',
              'formal_candidates_all',
              'heartbeat_comparison',
          ]
          missing = [k for k in required if k not in d]
          if missing:
              raise SystemExit(f'Missing output keys: {missing}')
          if d.get('schema_version') != 5:
              raise SystemExit(f"Unexpected schema_version: {d.get('schema_version')}")
          if not d['data_status']['twse']['mother_count'] and not d['data_status']['tpex']['mother_count']:
              raise SystemExit('Both warrant universes are empty')
          top100 = d['pure_warrant_top100']
          if len(top100) > 100:
              raise SystemExit(f'Top100 contains {len(top100)} rows')
          for row in top100:
              if row.get('type') not in {'認購', '認售'}:
                  raise SystemExit(f"Non-warrant type in Top100: {row}")
              if row.get('market') not in {'TWSE', 'TPEx'}:
                  raise SystemExit(f"Unexpected market in Top100: {row}")
          print(d['pipeline']['certification_message'])
          print('All-market certified:', d['pipeline'].get('all_market_pure_warrant_top100_certifiable'))
          print('TWSE mother:', d['data_status']['twse']['mother_count'])
          print('TPEx mother:', d['data_status']['tpex']['mother_count'])
          print('Top100:', len(top100))
          print('Price <= 1.5:', d['filter_funnel']['top100_price_le_1_5_count'])
          print('Final > 180 days:', d['filter_funnel']['final_remaining_days_gt_180_count'])
          print('Calls:', len(d['bullish_calls']))
          print('Puts:', len(d['bearish_puts']))
          for name, meta in d.get('data_status', {}).get('endpoint_runtime', {}).items():
              if meta.get('official_fallback'):
                  print('Fallback:', name, meta.get('fallback_source'), 'for', meta.get('fallback_for'))
          PY

      - name: Commit compact heartbeat snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f user_data/tw_warrant_heartbeat/latest.json
          if [ -f user_data/tw_warrant_heartbeat/previous.json ]; then
            git add -f user_data/tw_warrant_heartbeat/previous.json
          fi
          if git diff --cached --quiet; then
            echo "No heartbeat data changes"
          else
            git commit -m "Update TW warrant heartbeat data"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi